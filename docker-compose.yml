services:
  postgres:
    image: postgres:16-alpine
    container_name: apparte_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apparte_db}
      POSTGRES_USER: ${POSTGRES_USER:-apparte_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apparte_pass}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-apparte_user} -d ${POSTGRES_DB:-apparte_db}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./caso-1-multitenant/backend
      dockerfile: Dockerfile
    container_name: apparte_backend
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-apparte_user}:${POSTGRES_PASSWORD:-apparte_pass}@postgres:5432/${POSTGRES_DB:-apparte_db}
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173,http://172.28.112.1:5173}
      PASSWORD_SALT_ROUNDS: ${PASSWORD_SALT_ROUNDS:-10}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-Password123!}
      SEED_TENANT_ALPHA_NAME: ${SEED_TENANT_ALPHA_NAME:-Alpha}
      SEED_TENANT_ALPHA_SLUG: ${SEED_TENANT_ALPHA_SLUG:-tenant-alpha}
      SEED_TENANT_ALPHA_ADMIN_EMAIL: ${SEED_TENANT_ALPHA_ADMIN_EMAIL:-admin@alpha.com}
      SEED_TENANT_ALPHA_USER_EMAIL: ${SEED_TENANT_ALPHA_USER_EMAIL:-user@alpha.com}
      SEED_TENANT_ALPHA_REPORT_FIRST_NAME: ${SEED_TENANT_ALPHA_REPORT_FIRST_NAME:-Jose}
      SEED_TENANT_ALPHA_REPORT_LAST_NAME: ${SEED_TENANT_ALPHA_REPORT_LAST_NAME:-Perez}
      SEED_TENANT_ALPHA_REPORT_LOCATION: ${SEED_TENANT_ALPHA_REPORT_LOCATION:-Madrid}
      SEED_TENANT_ALPHA_REPORT_INTERVENTION_TYPE: ${SEED_TENANT_ALPHA_REPORT_INTERVENTION_TYPE:-ACCIDENT_TIME}
      SEED_TENANT_BETA_NAME: ${SEED_TENANT_BETA_NAME:-Beta}
      SEED_TENANT_BETA_SLUG: ${SEED_TENANT_BETA_SLUG:-tenant-beta}
      SEED_TENANT_BETA_ADMIN_EMAIL: ${SEED_TENANT_BETA_ADMIN_EMAIL:-admin@beta.com}
      SEED_TENANT_BETA_USER_EMAIL: ${SEED_TENANT_BETA_USER_EMAIL:-user@beta.com}
      SEED_TENANT_BETA_REPORT_FIRST_NAME: ${SEED_TENANT_BETA_REPORT_FIRST_NAME:-Raul}
      SEED_TENANT_BETA_REPORT_LAST_NAME: ${SEED_TENANT_BETA_REPORT_LAST_NAME:-Garcia}
      SEED_TENANT_BETA_REPORT_LOCATION: ${SEED_TENANT_BETA_REPORT_LOCATION:-Barcelona}
      SEED_TENANT_BETA_REPORT_INTERVENTION_TYPE: ${SEED_TENANT_BETA_REPORT_INTERVENTION_TYPE:-MEDICAL_ASSISTANCE}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./caso-1-multitenant/frontend
      dockerfile: Dockerfile
    container_name: apparte_frontend
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
